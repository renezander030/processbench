<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">ProcessBench workflow</title>
  <desc id="desc">A five-step workflow: collect examples, define expected outcomes, mark hard blockers, run comparison, decide rollout.</desc>
  <rect width="960" height="300" fill="#f8fafc"/>
  <g font-family="Inter, Arial, sans-serif" fill="#0f172a">
    <text x="40" y="52" font-size="28" font-weight="700">Turn business examples into rollout checks</text>
    <text x="40" y="82" font-size="15" fill="#475569">Use real workflow cases to see what improves, what regresses, and what blocks rollout.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Inter, Arial, sans-serif" font-size="14">
    <g transform="translate(40 130)">
      <rect width="140" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="18" y="30" font-weight="700" fill="#0f172a">1. Examples</text>
      <text x="18" y="56" fill="#475569">5-20 real cases</text>
      <text x="18" y="76" fill="#475569">anonymized</text>
    </g>
    <line x1="190" y1="176" x2="238" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(250 130)">
      <rect width="140" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="18" y="30" font-weight="700" fill="#0f172a">2. Expected</text>
      <text x="18" y="56" fill="#475569">fields, routing,</text>
      <text x="18" y="76" fill="#475569">decisions</text>
    </g>
    <line x1="400" y1="176" x2="448" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(460 130)">
      <rect width="140" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="18" y="30" font-weight="700" fill="#0f172a">3. Blockers</text>
      <text x="18" y="56" fill="#475569">failures that</text>
      <text x="18" y="76" fill="#475569">stop rollout</text>
    </g>
    <line x1="610" y1="176" x2="658" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(670 130)">
      <rect width="140" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="18" y="30" font-weight="700" fill="#0f172a">4. Compare</text>
      <text x="18" y="56" fill="#475569">model, prompt,</text>
      <text x="18" y="76" fill="#475569">setting, vendor</text>
    </g>
    <line x1="820" y1="176" x2="868" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(880 130)">
      <rect width="40" height="92" rx="8" fill="#dbeafe" stroke="#2563eb"/>
      <text x="-26" y="116" font-weight="700" fill="#0f172a">5. Decide</text>
    </g>
  </g>
</svg>
